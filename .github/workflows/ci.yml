name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax Check (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run syntax check
        run: |
          python -m pip install --upgrade pip
          python -m py_compile main.py seaweed_browser/*.py tests/*.py
          python -m unittest discover -s tests -v

  build-windows:
    name: Build Windows (Nuitka)
    runs-on: windows-latest
    needs: syntax-check
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      asset_name: ${{ steps.version.outputs.asset_name }}
    env:
      APP_NAME: SeaweedFSBrowser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run tests with PySide6
        run: python -m unittest discover -s tests -v

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path seaweed_browser/core.py -Pattern '^APP_VERSION = "([^"]+)"$'
          if (-not $match) {
            throw "APP_VERSION not found in seaweed_browser/core.py"
          }
          $version = $match.Matches[0].Groups[1].Value
          "app_version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=v$version" >> $env:GITHUB_OUTPUT
          "artifact_dir=release/${env:APP_NAME}-v$version-windows-x64-standalone" >> $env:GITHUB_OUTPUT
          "asset_name=${env:APP_NAME}-v$version-windows-x64-standalone.zip" >> $env:GITHUB_OUTPUT

      - name: Build (standalone)
        shell: pwsh
        run: .\build.ps1

      - name: Archive release package
        shell: pwsh
        run: |
          $artifactDir = "${{ steps.version.outputs.artifact_dir }}"
          $assetName = "${{ steps.version.outputs.asset_name }}"
          if (-not (Test-Path $artifactDir)) {
            throw "Build output not found: $artifactDir"
          }
          if (Test-Path $assetName) {
            Remove-Item -Force $assetName
          }
          Compress-Archive -Path (Join-Path $artifactDir '*') -DestinationPath $assetName

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset_name }}
          path: ${{ steps.version.outputs.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches app version
        run: |
          test "${GITHUB_REF_NAME}" = "${{ needs.build-windows.outputs.release_tag }}"

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.asset_name }}
          path: release-artifact

      - name: Build release notes
        run: |
          python build_release_notes.py "${{ needs.build-windows.outputs.app_version }}" release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.release_tag }}
          name: Release ${{ needs.build-windows.outputs.release_tag }}
          body_path: release_body.md
          make_latest: true
          files: release-artifact/${{ needs.build-windows.outputs.asset_name }}
